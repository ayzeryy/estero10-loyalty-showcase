name: Showcase validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DO_NOT_TRACK: '1'
  EXPO_NO_TELEMETRY: '1'
  SUPABASE_TELEMETRY_DISABLED: 'true'

jobs:
  app:
    name: TypeScript, tests, and web export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: apps/mobile
      - run: npm run check:public
      - run: npm test
      - run: npm run test:unit
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run export:web
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-only-placeholder

  database:
    name: Local database contracts and concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run supabase:start
      - run: npm run db:reset
      - run: npm run db:lint
      - run: npm run test:integration
      - run: npm run demo:setup
      - name: Stop isolated local stack
        if: always()
        run: npm run supabase:stop
